{% extends 'base.html' %}

{% block content %}
  <h1>Lista użytkowników</h1>
  <a href="{{ url_for('admin.add_user') }}">Dodaj użytkownika</a>
  <ul>
    {% for user in users %}
      <li>
        <strong>{{ user.username }}</strong>
        <form method="post" action="{{ url_for('admin.delete_user', user_id=user.id) }}" style="display:inline;">
          <input type="submit" value="Usuń użytkownika"
            onclick="return confirm('Na pewno usunąć użytkownika {{ user.username }} i jego posty?');">
        </form>
        <ul>
          {% for post in posts_by_user[user.id] %}
            <li>
              {{ post.title }}
              <form method="post" action="{{ url_for('admin.delete_post', post_id=post.id) }}" style="display:inline;">
                <input type="submit" value="Usuń post"
                  onclick="return confirm('Na pewno usunąć post: {{ post.title }}?');">
              </form>
            </li>
          {% endfor %}
        </ul>
      </li>
    {% endfor %}
  </ul>
  <a href="{{ url_for('blog.index') }}">← Wróć do bloga</a>
{% endblock %}
